name: bottleneck-diagnose-fetch
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -r bottleneck/requirements.txt
      - name: fetch 분포 진단 실행
        run: |
          cd bottleneck
          python diagnose_fetch.py
