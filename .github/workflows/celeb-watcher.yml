name: celeb-watcher

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: celeb-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install requests feedparser

      - name: Validate saved state
        working-directory: celeb-watcher
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'seen_celeb_ids.json': list,
              'seen_celeb_meta.json': dict,
              'seen_twitter_blog.json': dict,
              'seen_credit.json': dict,
          }
          for name, kind in expected.items():
              p = Path(name)
              if not p.exists():
                  print(f'::warning::{name} missing; no previous history available')
                  continue
              data = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(data, kind):
                  raise ValueError(f'{name}: invalid state type')
              print(f'State loaded: {name}')
          PY

      - name: Run watcher
        id: watcher
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.CELEB_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CELEB_TELEGRAM_CHAT_ID }}
        working-directory: celeb-watcher
        run: python celeb_watcher.py

      - name: Snapshot state
        if: ${{ always() && steps.watcher.outcome != 'skipped' }}
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/celeb-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$backup"
          for f in seen_celeb_ids.json seen_celeb_meta.json seen_twitter_blog.json seen_credit.json; do
            if [ -f "celeb-watcher/$f" ]; then
              cp "celeb-watcher/$f" "$backup/$f"
            fi
          done
          echo "path=$backup" >> "$GITHUB_OUTPUT"

      - name: Commit all state files
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for f in seen_celeb_ids.json seen_celeb_meta.json seen_twitter_blog.json seen_credit.json; do
            if [ -f "celeb-watcher/$f" ]; then
              git add -f -- "celeb-watcher/$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "State unchanged"
            exit 0
          fi
          git commit -m "Persist watcher delivery history"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "State persisted (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::State conflict. Preserve the backup artifact before rerunning."
                exit 1
              fi
              sleep $((RANDOM % 5 + 2))
            fi
          done
          echo "::error::State push failed. Restore the backup artifact before rerunning."
          exit 1

      - name: Keep recovery backup if state save failed
        if: ${{ always() && steps.snapshot.outcome == 'success' && steps.persist.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: celeb-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.snapshot.outputs.path }}/*.json
          if-no-files-found: error
          retention-days: 30
