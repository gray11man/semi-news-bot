name: Industry Idea News

on:
  schedule:
    - cron: '17 0 * * *' # 매일 한국시간 오전 9시 17분 (UTC 00:17)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '체크하면 Telegram 미전송. 실제 API 사용량은 하루 예산에 포함됩니다.'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: bottleneck-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RADAR_DATA_DIR: /tmp/industry-radar-data
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: python -m pip install -r bottleneck/requirements.txt

      - name: 이전 분석 기억 및 토큰 장부 복원
        id: restore
        working-directory: bottleneck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ci_state.py recover
          python ci_state.py restore

      - name: 산업변화 분석 및 전송
        id: radar
        timeout-minutes: 40
        working-directory: bottleneck
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          BOTTLENECK_TOKEN: ${{ secrets.BOTTLENECK_TOKEN }}
          BOTTLENECK_CHAT_ID: ${{ secrets.BOTTLENECK_CHAT_ID }}
          RADAR_MODEL: ${{ vars.RADAR_MODEL || vars.PICK_MODEL || 'gemini-2.5-flash' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SEND_EMPTY: '1'
          MAX_GEMINI_CALLS: '10'
          MAX_INPUT_TOKENS: '36000'
          MAX_RUN_TOKENS: '160000'
          MAX_DAY_TOKENS: '500000'
          SCREEN_BATCHES: '3'
          SCREEN_BATCH_SIZE: '80'
          RESEARCH_THEMES_PER_RUN: '3'
          DOCS_PER_THEME: '16'
          DOC_CHARS: '3000'
          FRESH_HOURS: '72'
        run: python main.py --send

      - name: 분석 기억과 사용량의 일관된 복구본 생성
        id: snapshot
        if: always() && steps.restore.outcome == 'success'
        working-directory: bottleneck
        run: python ci_state.py snapshot

      - name: 저장 실패에 대비한 복구본 보관
        if: always() && steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: industry-radar-state
          path: bottleneck/state/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

      - name: 분석 기억과 토큰 장부를 저장소에 저장
        if: always() && steps.snapshot.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -f bottleneck/state/manifest.json ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- bottleneck/state/radar.sqlite3.gz bottleneck/state/usage.sqlite3.gz bottleneck/state/manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Save industry radar memory and usage [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
          done
          echo '기억 저장 실패. Actions 복구본을 확인하세요.'
          exit 1

      - name: 실행 보고서 보관
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: industry-radar-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/industry-radar-data/latest.md
            /tmp/industry-radar-data/preview.md
          if-no-files-found: ignore
          retention-days: 14
