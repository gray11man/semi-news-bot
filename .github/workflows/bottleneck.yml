name: Industry Idea News
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '전송 없이 선별 결과만 확인'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: bottleneck-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bottleneck/requirements.txt
      - name: Collect, select and send
        working-directory: bottleneck
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          BOTTLENECK_TOKEN: ${{ secrets.BOTTLENECK_TOKEN }}
          BOTTLENECK_CHAT_ID: ${{ secrets.BOTTLENECK_CHAT_ID }}
          PICK_MODEL: ${{ vars.PICK_MODEL || 'gemini-2.5-flash' }}
          MAX_PICK: '3'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python main.py
      - name: Persist confirmed deliveries even after partial failure
        if: always()
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bottleneck/seen_ideas.json ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bottleneck/seen_ideas.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Save confirmed news deliveries [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
          done
          exit 1
      - name: Preserve delivery history for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottleneck-delivery-history
          path: bottleneck/seen_ideas.json
          if-no-files-found: ignore
          retention-days: 30
